# Blueprint Render: backend (Docker) + PostgreSQL. Frontend triển khai riêng trên Vercel.
services:
  - type: web
    name: ckd-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: ckd-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false   # đặt = URL frontend trên Vercel, vd https://ckd-app.vercel.app
databases:
  - name: ckd-db
    plan: free
